version: 2

models:
  - name: stg_touchpoints
    description: |
      Unified staging model for touchpoints. Normalizes raw GA4, Meta Pixel, CallRail, and Helpdesk
      feeds into a canonical touchpoint schema and attempts to resolve identities using the
      `stg_customers_unification` model where possible.
    columns:
      - name: platform_id
        description: "Original platform event ID or row ID, prefixed with source to be globally unique."
        tests:
          - not_null
          - unique
      - name: resolved_known_customer_id
        description: "Known Shopify customer_id when the touchpoint could be resolved via the unification model."
      - name: resolved_customer_profile_id
        description: "Customer profile id (unified identity) when available from stg_customers_unification."
      - name: match_method
        description: "Method used to resolve the identity (customer_id_match, email_match, phone_match, unknown)."
      - name: channel
        description: "Canonical touchpoint channel category (paid_search, paid_social, email, organic, phone, email_inbound)."
        tests:
          - not_null
      - name: campaign
        description: "Campaign or event category associated with the touchpoint."
      - name: event_timestamp
        description: "Canonical event timestamp for the touchpoint."
        tests:
          - not_null
      - name: raw_source
        description: "Source table name where the row originated."
      - name: raw_identifier
        description: "Source-specific identifier used for join/lookup logic, such as phone number or email."
