version: 2

models:
  - name: fct_attribution_linear
    description: |
      Linear attribution mart. Splits a converting journey's conversion and
      revenue credit equally across every touchpoint in that journey. One row
      per channel. Schema matches the other `fct_attribution_*` marts so they
      can be unioned into `fct_attribution_summary`. Unlike first/last-touch,
      `attributed_conversions` is fractional (sum of per-touch credit weights),
      not a whole-number journey count.
    columns:
      - name: channel
        description: "Canonical touchpoint channel (paid_search, paid_social, email, organic, phone, email_inbound)."
        data_tests:
          - not_null
          - unique
      - name: attribution_method
        description: "Constant 'linear', identifying this mart's method once unioned with the others."
        data_tests:
          - not_null
      - name: attributed_conversions
        description: "Sum of fractional conversion credit (1 / touches in journey) attributed to this channel."
        data_tests:
          - not_null
      - name: attributed_revenue
        description: "Sum of order revenue credited to this channel under linear attribution."
        data_tests:
          - not_null
