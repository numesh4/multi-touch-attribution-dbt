version: 2

models:
  - name: fct_attribution_last_touch
    description: |
      Last-touch attribution mart. Gives 100% of a converting journey's conversion
      and revenue credit to the channel of that journey's last touchpoint. One row
      per channel. Schema matches the other `fct_attribution_*` marts so they can be
      unioned into `fct_attribution_summary`.
    columns:
      - name: channel
        description: "Canonical touchpoint channel (paid_search, paid_social, email, organic, phone, email_inbound)."
        data_tests:
          - not_null
          - unique
      - name: attribution_method
        description: "Constant 'last_touch', identifying this mart's method once unioned with the others."
        data_tests:
          - not_null
      - name: attributed_conversions
        description: "Count of distinct converting journeys credited to this channel."
        data_tests:
          - not_null
      - name: attributed_revenue
        description: "Sum of order revenue credited to this channel under last-touch attribution."
        data_tests:
          - not_null
