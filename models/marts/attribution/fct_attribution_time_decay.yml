version: 2

models:
  - name: fct_attribution_time_decay
    description: |
      Time-decay attribution mart. Credits each touchpoint in a converting
      journey using exponential decay (7-day half-life) based on days between
      that touch and the conversion, normalized so each journey's weights sum
      to 1. One row per channel. Schema matches the other `fct_attribution_*`
      marts so they can be unioned into `fct_attribution_summary`. Like linear,
      `attributed_conversions` is fractional, not a whole-number journey count.
    columns:
      - name: channel
        description: "Canonical touchpoint channel (paid_search, paid_social, email, organic, phone, email_inbound)."
        data_tests:
          - not_null
          - unique
      - name: attribution_method
        description: "Constant 'time_decay', identifying this mart's method once unioned with the others."
        data_tests:
          - not_null
      - name: attributed_conversions
        description: "Sum of decay-weighted conversion credit attributed to this channel."
        data_tests:
          - not_null
      - name: attributed_revenue
        description: "Sum of order revenue credited to this channel under time-decay attribution."
        data_tests:
          - not_null
